# Compose file for fetchlinks-web.
#
# Local dev defaults:
#   - DB mount points at the repo's ingest db dir.
#   - Image is built locally as fetchlinks-web:local.
#
# VM/production overrides (via env or a compose.override.yaml):
#   FETCHLINKS_WEB_IMAGE=fetchlinksacr.azurecr.io/fetchlinks-web:<sha>
#   FETCHLINKS_DB_HOST_DIR=/var/lib/fetchlinks

services:
  web:
    image: ${FETCHLINKS_WEB_IMAGE:-fetchlinks-web:local}
    build:
      context: ./web
      dockerfile: ../Dockerfile.web
    container_name: fetchlinks-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      FETCHLINKS_DB: /data/fetchlinks.db
    volumes:
      - ${FETCHLINKS_DB_HOST_DIR:-./ingest/fetchlinks/db}:/data:ro
