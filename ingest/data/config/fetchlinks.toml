# Fetchlinks runtime configuration.
#
# All path values may be absolute or relative to this file's directory.
# Production installs use this file directly from whichever checkout directory
# bootstrap.sh is run from.

[paths]
db        = "../../db/fetchlinks.db"
log_file  = "../logs/fetch_links.log"
log_level = "INFO"

[ingest]
max_post_age_months                  = 3
excluded_url_host_keywords           = ["businessinsider", "economist.com", "brighttalk.com"]
excluded_url_or_description_keywords = ["trump", "covid"]

[retention]
# Pruning weekly via fetchlinks-retain.timer.
# max_post_age_months omitted => falls back to [ingest].max_post_age_months.
enabled                 = true
vacuum_threshold_pages  = 1000

# --- Sources ---------------------------------------------------------------
# Credentials are read from the JSON files referenced by `credential_location`
# (paths starting with ~ are expanded).

[sources.rss]
enabled                     = true
# One-time seed; loaded into the rss_feeds table only when the table is empty.
seed_file                   = "rss_feeds.txt"
# Where fetchlinks-export-rss-feeds writes the deterministic DB snapshot.
# In dev this intentionally updates the seed file you review and commit.
export_path                 = "rss_feeds.txt"
auto_disable_after_failures = 10
request_timeout_seconds     = 10

[sources.reddit]
enabled             = true
credential_location = "~/.fetchlinks/reddit.json"
# One-time seed; loaded into the subreddits table only when the table is empty
# (via subreddit_import.py --seed-if-empty, run by bootstrap). After seeding the
# DB is the live source of truth; manage subreddits from the web admin.
seed_file           = "subreddits.txt"
# Optional: listing_limit (default 100), max_pages (default 5)

[sources.bluesky]
enabled             = true
credential_location = "~/.fetchlinks/bluesky.json"
timeline_limit      = 50

[sources.mastodon]
enabled = true

[[sources.mastodon.instances]]
name                = "infosec"
instance_url        = "https://infosec.exchange"
credential_location = "~/.fetchlinks/mastodon-infosec.json"
timeline            = "home"
timeline_limit      = 40
